name: checks
run-name: Checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v3
      - uses: actions/checkout@v4
      - run: uv sync --extra jwt --all-groups
      - run: make test
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v3
      - uses: actions/checkout@v4
      - run: uv sync --extra jwt --all-groups
      - run: make lint

